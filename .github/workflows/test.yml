name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fixture-suite:
    # Pinned: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19
    # (actions/runner-images#14748), and the suite was proven green there first.
    # A pin keeps the image from changing under the suite, and the migration
    # notice off the run annotations.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # jq, the only other dev dependency, is preinstalled on the runner image.
      # tests/live.bats shows as skipped: the live suite never runs in CI.
      - name: Run the bats suites
        run: tests/libs/bats-core/bin/bats tests/
