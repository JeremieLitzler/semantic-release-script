# The website is deployed by a build hook that the release workflow calls, not by
# a push. The publish directory is relative to the base, and there is no build
# command: the compiled stylesheet is committed. Netlify reads this file only
# at the repository root (or at a base set in the dashboard), so it lives here
# and points at the site folder with base.
[build]
  base = "website"
  publish = "."
  command = ""

  # Only the build hook deploys. Exit 0 tells Netlify to skip the build, and the
  # hook sets INCOMING_HOOK_TITLE, so pushes and pull requests (deploy previews)
  # are skipped. Netlify's docs say ignore never cancels a hook-triggered build.
  ignore = "test -z \"$INCOMING_HOOK_TITLE\""

  # Every dependency of the site is a devDependency (the Tailwind CLI, which the
  # committed stylesheet makes unnecessary here), so production skips the install.
  [build.environment]
    NODE_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src https://api.github.com; frame-ancestors 'none'"
