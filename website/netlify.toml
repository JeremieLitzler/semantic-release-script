# The site is deployed by a build hook that the release workflow calls, not by
# a push. The publish directory is relative to the base, and there is no build
# command: the compiled stylesheet is committed.
[build]
  base = "website"
  publish = "."
  command = ""

  # Every dependency of the site is a devDependency (the Tailwind CLI, which the
  # committed stylesheet makes unnecessary here), so production skips the install.
  [build.environment]
    NODE_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src https://api.github.com; frame-ancestors 'none'"
